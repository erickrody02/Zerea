<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#241B2F; --paper:#F2EFE9; --surface:#FFFFFF;
    --plum:#3B1730; --plum-light:#5C2A4D; --gold:#B8863A; --gold-light:#D9B876;
    --rose:#9C4E56; --line:#DED5C4; --line-soft:#EAE3D5;
    --whatsapp:#25D366; --whatsapp-dark:#1DA851;
    --shadow: 0 10px 26px -10px rgba(36,27,47,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  .brand-word{ font-family:'Fraunces', serif; }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea{ font-family:inherit; font-size:16px; }
  ::selection{ background:var(--gold-light); }

  /* ---------- Encabezado ---------- */
  .shop-header{ background:var(--plum); color:#fff; padding:24px 20px 18px; }
  .shop-header .brand-word{ font-size:27px; }
  .shop-header .brand-sub{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-light); margin-top:3px; font-weight:600; }
  #search-input{
    width:100%; margin-top:16px; padding:12px 14px; border:none; border-radius:9px;
    background:rgba(255,255,255,.94); color:var(--ink);
  }
  #search-input::placeholder{ color:#8b7f6f; }

  /* ---------- Categorías (chips) ---------- */
  .category-chips{
    display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding:14px 18px; scrollbar-width:thin;
  }
  .chip{
    flex-shrink:0; padding:8px 16px; border-radius:20px; border:1px solid var(--line);
    background:var(--surface); font-size:13px; font-weight:600; color:#6b6152; white-space:nowrap;
  }
  .chip.active{ background:var(--plum); color:#fff; border-color:var(--plum); }

  /* ---------- Etiqueta tipo joyería (mismo lenguaje visual del panel admin) ---------- */
  .tag{
    display:inline-flex; align-items:center; position:relative; align-self:flex-start;
    padding:3px 9px 3px 18px; border-radius:3px 8px 8px 3px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.05em;
    text-transform:uppercase; color:#fff; background:var(--plum);
  }
  .tag::before{
    content:""; position:absolute; left:6px; top:50%; transform:translateY(-50%);
    width:5px; height:5px; border-radius:50%; background:var(--paper);
    box-shadow:0 0 0 1.5px rgba(255,255,255,.55) inset;
  }
  .tag--servicio{ background:var(--rose); }

  /* ---------- Catálogo ---------- */
  .catalog-wrap{ padding:4px 18px 90px; max-width:1080px; margin:0 auto; }
  .catalog-empty{ text-align:center; color:#8b7f6f; padding:60px 20px; font-style:italic; }
  .catalog-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:14px; }
  @media(min-width:640px){ .catalog-grid{ grid-template-columns:repeat(auto-fill,minmax(195px,1fr)); gap:18px; } }

  .product-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; transition:box-shadow .15s ease, transform .15s ease;
  }
  .product-card:hover{ box-shadow:var(--shadow); transform:translateY(-3px); }
  .product-photo{ width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--line-soft); display:block; }
  .product-photo-placeholder{
    width:100%; aspect-ratio:1/1; background:linear-gradient(135deg,var(--line-soft),#f7f3ec);
    display:flex; align-items:center; justify-content:center; color:#b8ab97; font-size:30px;
  }
  .product-body{ padding:12px 13px 13px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .product-name{ font-weight:600; font-size:14px; line-height:1.3; }
  .product-desc{
    font-size:12px; color:#7c7060; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .stock-note{ font-size:11px; color:var(--rose); font-weight:700; }
  .product-price-row{ margin-top:auto; padding-top:6px; }
  .product-price{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:17px; color:var(--plum); }
  .btn-add{
    margin-top:9px; width:100%; padding:10px; border-radius:8px; border:none;
    background:var(--plum); color:#fff; font-weight:600; font-size:13px;
  }
  .btn-add:active{ background:var(--plum-light); }
  .btn-add:disabled{ background:var(--line-soft); color:#a89c8a; }

  /* ---------- Botón flotante del carrito ---------- */
  .cart-fab{
    position:fixed; right:18px; bottom:18px; width:58px; height:58px; border-radius:50%;
    background:var(--plum); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 28px -8px rgba(59,23,48,.55); z-index:60;
  }
  .cart-fab svg{ width:24px; height:24px; }
  .cart-count{
    position:absolute; top:-3px; right:-3px; background:var(--gold); color:#2A1E0E;
    font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
    box-shadow:0 0 0 2px var(--paper);
  }

  /* ---------- Carrito (panel lateral) ---------- */
  #cart-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,12,18,.5); z-index:65; }
  #cart-backdrop.open{ display:block; }
  #cart-drawer{
    position:fixed; top:0; right:0; bottom:0; width:400px; max-width:92vw; background:var(--paper);
    z-index:70; transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column; box-shadow:-18px 0 44px -16px rgba(0,0,0,.4);
  }
  #cart-drawer.open{ transform:translateX(0); }
  .cart-drawer-header{
    display:flex; align-items:center; justify-content:space-between; padding:18px 20px;
    border-bottom:1px solid var(--line); background:var(--surface); flex-shrink:0;
  }
  .cart-drawer-header h2{ margin:0; font-size:17px; color:var(--plum); }
  #btn-close-cart{ width:34px; height:34px; border-radius:8px; border:none; background:var(--line-soft); font-size:16px; }

  .cart-body{ flex:1; overflow-y:auto; padding:8px 18px; }
  #cart-empty-msg{ text-align:center; color:#8b7f6f; padding:50px 10px; font-size:13.5px; line-height:1.6; }
  .cart-item{ display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--line-soft); }
  .cart-item-photo{ width:54px; height:54px; border-radius:8px; object-fit:cover; background:var(--line-soft); flex-shrink:0; }
  .cart-item-photo.placeholder{ display:flex; align-items:center; justify-content:center; color:#b8ab97; }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-name{ font-weight:600; font-size:13.5px; }
  .cart-item-price{ font-size:11.5px; color:#7c7060; margin-top:1px; }
  .qty-stepper{ display:flex; align-items:center; gap:9px; margin-top:7px; }
  .qty-stepper button{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--surface);
    font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .qty-stepper button:disabled{ opacity:.4; }
  .qty-stepper span{ font-family:'IBM Plex Mono', monospace; font-weight:600; min-width:16px; text-align:center; }
  .cart-item-remove{ background:none; border:none; color:var(--rose); font-size:11px; text-decoration:underline; margin-left:6px; }
  .cart-item-subtotal{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--plum); white-space:nowrap; align-self:flex-start; }

  .cart-footer{ border-top:1px solid var(--line); background:var(--surface); padding:16px 20px 20px; flex-shrink:0; }
  .cart-total-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:15.5px; font-weight:700; margin-bottom:12px; }
  .cart-total-row .num{ font-family:'IBM Plex Mono', monospace; font-size:20px; color:var(--plum); }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--plum); margin-bottom:4px; }
  .field input, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:9px 11px; background:var(--paper); color:var(--ink);
  }
  .field textarea{ min-height:52px; resize:vertical; }
  .btn-whatsapp{
    width:100%; padding:13px; border-radius:9px; border:none; background:var(--whatsapp); color:#fff;
    font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px;
  }
  .btn-whatsapp:active{ background:var(--whatsapp-dark); }
  .btn-whatsapp svg{ width:18px; height:18px; }
  .cart-disclaimer{ font-size:10.5px; color:#8b7f6f; text-align:center; margin-top:10px; line-height:1.4; }

  /* ---------- Toast ---------- */
  #toast-container{ position:fixed; top:16px; left:12px; right:12px; z-index:99; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .toast{
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:var(--shadow); max-width:340px; text-align:center; animation:toast-in .2s ease;
  }
  .toast.error{ background:#A63D2E; }
  .toast.success{ background:#3F6B54; }
  @keyframes toast-in{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:none;} }

  @media(max-width:420px){
    #cart-drawer{ width:100vw; max-width:100vw; }
  }
</style>
</head>
<body>

<div id="toast-container"></div>

<header class="shop-header">
  <div class="brand-word">Atelier</div>
  <div class="brand-sub">Joyería · Ropa · Eventos</div>
  <input type="text" id="search-input" placeholder="Buscar en el catálogo…">
</header>

<nav class="category-chips" id="category-chips"></nav>

<main class="catalog-wrap">
  <div class="catalog-empty hidden" id="catalog-empty">No encontramos artículos con ese filtro.</div>
  <div class="catalog-grid" id="catalog-grid"></div>
</main>

<button class="cart-fab" id="cart-fab" aria-label="Ver pedido">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2A2 2 0 0 0 9.35 17H17a2 2 0 0 0 1.95-1.57L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
  <span class="cart-count hidden" id="cart-count">0</span>
</button>

<div id="cart-backdrop"></div>
<aside id="cart-drawer">
  <div class="cart-drawer-header">
    <h2>Tu pedido</h2>
    <button id="btn-close-cart" aria-label="Cerrar">✕</button>
  </div>
  <div class="cart-body">
    <div id="cart-empty-msg">Tu carrito está vacío.<br>Agrega artículos del catálogo para armar tu pedido.</div>
    <div id="cart-items"></div>
  </div>
  <div class="cart-footer hidden" id="cart-footer">
    <div class="cart-total-row"><span>Total</span><span class="num" id="cart-total-num">$0.00</span></div>
    <div class="field">
      <label for="cliente-nombre">Tu nombre *</label>
      <input type="text" id="cliente-nombre" placeholder="¿A nombre de quién va el pedido?">
    </div>
    <div class="field">
      <label for="cliente-telefono">Teléfono (opcional)</label>
      <input type="tel" id="cliente-telefono" placeholder="Para confirmarte el pedido">
    </div>
    <div class="field">
      <label for="cliente-notas">Notas (opcional)</label>
      <textarea id="cliente-notas" placeholder="Talla, color, fecha de entrega…"></textarea>
    </div>
    <button id="btn-enviar-pedido" class="btn-whatsapp">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.6-1.5-.9-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3 1 2.5c.1.1 1.6 2.5 4 3.5.6.2 1 .4 1.3.5.6.2 1.1.1 1.5.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.4-.3z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <div class="cart-disclaimer">Precios y existencias sujetos a confirmación al recibir tu pedido.</div>
  </div>
</aside>

<script>
/* =====================================================================
   CONFIGURACIÓN — reemplaza con los datos de tu proyecto Supabase
   y el número de WhatsApp que recibirá los pedidos.
   ===================================================================== */
const SUPABASE_URL = 'TU_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';

// Formato para México: 52 + 1 + número a 10 dígitos (WhatsApp todavía pide
// el "1" para números mexicanos aunque ya no se use para llamadas/SMS).
// Si el enlace no abre el chat correcto, prueba sin el "1": '526271494917'
const WHATSAPP_NUMBER = '5216271494917';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================================
   ESTADO
   ===================================================================== */
let catalogo = [];
let cart = [];
let activeCategory = '';
let searchTerm = '';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
function $(sel, ctx) { return (ctx || document).querySelector(sel); }
function fmtMoney(n) {
  return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

/* =====================================================================
   CARGA DEL CATÁLOGO (vista pública v_catalogo, solo lectura, sin login)
   ===================================================================== */
async function init() {
  try {
    const { data, error } = await sb
      .from('v_catalogo')
      .select('*')
      .gt('cantidad', 0)
      .order('categoria', { ascending: true })
      .order('nombre', { ascending: true });
    if (error) throw error;
    catalogo = data || [];
  } catch (err) {
    console.error('Error al cargar el catálogo:', err);
    $('#catalog-empty').textContent = 'No pudimos cargar el catálogo en este momento. Intenta de nuevo más tarde.';
    $('#catalog-empty').classList.remove('hidden');
    return;
  }
  renderChips();
  renderGrid();
}

function renderChips() {
  const cats = Array.from(new Set(catalogo.map(p => p.categoria).filter(Boolean))).sort();
  const wrap = $('#category-chips');
  wrap.innerHTML = '';
  wrap.appendChild(makeChip('Todos', ''));
  cats.forEach(c => wrap.appendChild(makeChip(c, c)));
}
function makeChip(label, value) {
  const b = document.createElement('button');
  b.className = 'chip' + (activeCategory === value ? ' active' : '');
  b.textContent = label;
  b.addEventListener('click', () => { activeCategory = value; renderChips(); renderGrid(); });
  return b;
}

function getFiltered() {
  return catalogo.filter(p => {
    if (activeCategory && p.categoria !== activeCategory) return false;
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      const hay = (p.nombre || '').toLowerCase().includes(s) || (p.descripcion || '').toLowerCase().includes(s);
      if (!hay) return false;
    }
    return true;
  });
}

/* =====================================================================
   RENDER DE PRODUCTOS
   ===================================================================== */
function renderGrid() {
  const items = getFiltered();
  const grid = $('#catalog-grid');
  const empty = $('#catalog-empty');
  if (!items.length) { grid.innerHTML = ''; empty.textContent = 'No encontramos artículos con ese filtro.'; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  grid.innerHTML = items.map(p => {
    const inCart = cart.find(c => c.id === p.id);
    const atMax = inCart && inCart.cantidad >= p.cantidad;
    const low = p.cantidad <= 3;
    return `
    <div class="product-card">
      ${p.foto_url ? `<img class="product-photo" src="${p.foto_url}" loading="lazy" alt="${escapeHtml(p.nombre)}">` : `<div class="product-photo-placeholder">✦</div>`}
      <div class="product-body">
        <span class="tag ${p.categoria_tipo === 'servicio' ? 'tag--servicio' : ''}">${escapeHtml(p.categoria || '')}</span>
        <div class="product-name">${escapeHtml(p.nombre)}</div>
        ${p.descripcion ? `<div class="product-desc">${escapeHtml(p.descripcion)}</div>` : ''}
        ${low ? `<div class="stock-note">¡Solo quedan ${p.cantidad}!</div>` : ''}
        <div class="product-price-row"><span class="product-price">${fmtMoney(p.precio_venta)}</span></div>
        <button class="btn-add" data-add="${p.id}" ${atMax ? 'disabled' : ''}>${atMax ? 'Máximo agregado' : 'Agregar al carrito'}</button>
      </div>
    </div>`;
  }).join('');
}

$('#catalog-grid').addEventListener('click', (e) => {
  const id = e.target.dataset.add;
  if (id) addToCart(id);
});

$('#search-input').addEventListener('input', (e) => { searchTerm = e.target.value; renderGrid(); });

/* =====================================================================
   CARRITO
   ===================================================================== */
function addToCart(id) {
  const p = catalogo.find(x => x.id === id);
  if (!p) return;
  let item = cart.find(c => c.id === id);
  if (item) {
    if (item.cantidad >= p.cantidad) { toast('No hay más existencias disponibles', 'error'); return; }
    item.cantidad++;
  } else {
    cart.push({ id: p.id, nombre: p.nombre, precio_venta: p.precio_venta, foto_url: p.foto_url, cantidad: 1, disponible: p.cantidad });
  }
  renderCart();
  renderGrid();
  toast('Agregado al carrito ✓');
}

function renderCart() {
  const wrap = $('#cart-items');
  const emptyMsg = $('#cart-empty-msg');
  const footer = $('#cart-footer');
  const count = cart.reduce((s, i) => s + i.cantidad, 0);
  $('#cart-count').textContent = count;
  $('#cart-count').classList.toggle('hidden', count === 0);

  if (!cart.length) {
    wrap.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    footer.classList.add('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');
  footer.classList.remove('hidden');

  wrap.innerHTML = cart.map(item => `
    <div class="cart-item">
      ${item.foto_url ? `<img class="cart-item-photo" src="${item.foto_url}">` : `<div class="cart-item-photo placeholder">✦</div>`}
      <div class="cart-item-info">
        <div class="cart-item-name">${escapeHtml(item.nombre)}</div>
        <div class="cart-item-price">${fmtMoney(item.precio_venta)} c/u</div>
        <div class="qty-stepper">
          <button data-qty-dec="${item.id}">−</button>
          <span>${item.cantidad}</span>
          <button data-qty-inc="${item.id}" ${item.cantidad >= item.disponible ? 'disabled' : ''}>+</button>
          <button class="cart-item-remove" data-remove="${item.id}">Quitar</button>
        </div>
      </div>
      <div class="cart-item-subtotal">${fmtMoney(item.cantidad * item.precio_venta)}</div>
    </div>`).join('');

  const total = cart.reduce((s, i) => s + i.cantidad * i.precio_venta, 0);
  $('#cart-total-num').textContent = fmtMoney(total);
}

$('#cart-items').addEventListener('click', (e) => {
  const inc = e.target.dataset.qtyInc, dec = e.target.dataset.qtyDec, rem = e.target.dataset.remove;
  if (inc) { const item = cart.find(c => c.id === inc); if (item && item.cantidad < item.disponible) item.cantidad++; }
  if (dec) { const item = cart.find(c => c.id === dec); if (item) { item.cantidad--; if (item.cantidad <= 0) cart = cart.filter(c => c.id !== dec); } }
  if (rem) { cart = cart.filter(c => c.id !== rem); }
  renderCart();
  renderGrid();
});

function openCart() { $('#cart-drawer').classList.add('open'); $('#cart-backdrop').classList.add('open'); }
function closeCart() { $('#cart-drawer').classList.remove('open'); $('#cart-backdrop').classList.remove('open'); }
$('#cart-fab').addEventListener('click', openCart);
$('#btn-close-cart').addEventListener('click', closeCart);
$('#cart-backdrop').addEventListener('click', closeCart);

/* =====================================================================
   ENVIAR PEDIDO POR WHATSAPP
   ===================================================================== */
$('#btn-enviar-pedido').addEventListener('click', () => {
  if (!cart.length) { toast('Tu carrito está vacío', 'error'); return; }
  const nombre = $('#cliente-nombre').value.trim();
  if (!nombre) { toast('Escribe tu nombre para continuar', 'error'); $('#cliente-nombre').focus(); return; }
  const telefono = $('#cliente-telefono').value.trim();
  const notas = $('#cliente-notas').value.trim();
  const total = cart.reduce((s, i) => s + i.cantidad * i.precio_venta, 0);

  const lines = [];
  lines.push('🛍️ *Nuevo pedido — Atelier*');
  lines.push('');
  lines.push('Cliente: ' + nombre);
  if (telefono) lines.push('Teléfono: ' + telefono);
  lines.push('');
  lines.push('Productos:');
  cart.forEach((item, i) => {
    lines.push((i + 1) + '. ' + item.nombre + '  x' + item.cantidad + '  —  ' + fmtMoney(item.precio_venta) + ' c/u = ' + fmtMoney(item.cantidad * item.precio_venta));
  });
  lines.push('');
  lines.push('*Total: ' + fmtMoney(total) + '*');
  if (notas) { lines.push(''); lines.push('Notas: ' + notas); }
  lines.push('');
  lines.push('_Precios y existencias sujetos a confirmación._');

  const message = lines.join('\n');
  const url = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);

  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();

  cart = [];
  renderCart();
  renderGrid();
  closeCart();
  $('#cliente-nombre').value = ''; $('#cliente-telefono').value = ''; $('#cliente-notas').value = '';
  toast('¡Pedido enviado! Te contactaremos pronto.', 'success');
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
