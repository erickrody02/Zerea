<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zeréa Jewelry — Anuncio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Jost:wght@300;400;500&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px;
    background: #EAE2D3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
  }

  .ad {
    width: 640px;
    max-width: 100%;
    aspect-ratio: 4 / 5;
    position: relative;
    background: radial-gradient(ellipse at 50% -10%, #FBF7EF 0%, #F3E9D8 55%, #ECDFC8 100%);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(90, 65, 40, 0.25);
  }

  .stone-vein {
    position: absolute;
    inset: 0;
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 56px 48px 44px;
    text-align: center;
  }

  .mark { width: 34px; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .brand-name {
    font-family: 'Beau Rivage', cursive;
    font-size: 88px;
    line-height: 0.9;
    color: #9C6C46;
    margin: 6px 0 0;
  }

  .brand-sub {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 7px;
    color: #9C6C46;
  }

  .scene { width: 340px; max-width: 80%; }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    color: #5C4632;
    max-width: 320px;
    line-height: 1.5;
  }

  .cta {
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    color: #7A4F30;
    text-decoration: none;
    border-bottom: 1px solid #B08A63;
    padding-bottom: 3px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="ad">
    <svg class="stone-vein" viewBox="0 0 640 800" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,120 C160,150 260,90 420,130 C520,155 580,110 640,140" stroke="#DDCBAA" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M0,640 C140,610 260,660 420,620 C520,595 580,650 640,610" stroke="#DDCBAA" stroke-width="1" fill="none" opacity="0.6"/>
      <path d="M0,700 C180,730 300,690 480,720 C560,735 600,700 640,715" stroke="#D8C39C" stroke-width="1" fill="none" opacity="0.4"/>
    </svg>

    <div class="content">
      <svg class="mark" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
        <polygon points="15,25 85,25 50,75" fill="none" stroke="#9C6C46" stroke-width="2.5"/>
        <polyline points="15,25 35,10 65,10 85,25" fill="none" stroke="#9C6C46" stroke-width="2.5"/>
        <line x1="35" y1="10" x2="27" y2="25" stroke="#9C6C46" stroke-width="1.8"/>
        <line x1="50" y1="10" x2="40" y2="25" stroke="#9C6C46" stroke-width="1.8"/>
        <line x1="50" y1="10" x2="60" y2="25" stroke="#9C6C46" stroke-width="1.8"/>
        <line x1="65" y1="10" x2="73" y2="25" stroke="#9C6C46" stroke-width="1.8"/>
        <line x1="27" y1="25" x2="50" y2="75" stroke="#9C6C46" stroke-width="1.8"/>
        <line x1="73" y1="25" x2="50" y2="75" stroke="#9C6C46" stroke-width="1.8"/>
      </svg>

      <div class="brand">
        <div class="brand-name">Zeréa</div>
        <div class="brand-sub">JEWELRY</div>
      </div>

      <svg class="scene" viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg">
        <path d="M20,150 C60,120 100,180 160,155 C220,130 260,175 320,150 C330,146 335,150 330,158 C260,190 220,148 160,170 C100,192 60,150 15,160 C10,158 14,152 20,150 Z" fill="#EAE0CC" opacity="0.8"/>
        <path d="M60,90 Q100,60 150,85 Q180,100 165,130 Q150,150 170,165" fill="none" stroke="#A97748" stroke-width="1.6"/>
        <circle cx="60" cy="90" r="3.5" fill="#A97748"/>
        <circle cx="115" cy="72" r="3.5" fill="#A97748"/>
        <circle cx="165" cy="130" r="3.5" fill="#A97748"/>
        <polygon points="163,163 177,163 170,175" fill="#A97748"/>
        <circle cx="235" cy="120" r="24" fill="none" stroke="#A97748" stroke-width="2.6"/>
        <polygon points="228,92 242,92 235,104" fill="#A97748"/>
        <polygon points="270,70 276,70 273,78" fill="#A97748" opacity="0.7"/>
        <polygon points="290,110 295,110 292.5,117" fill="#A97748" opacity="0.5"/>
      </svg>

      <div class="tagline">Detalles en oro que se quedan contigo.</div>

      <a class="cta" href="https://erickrody02.github.io/Zerea/catalogoparaordenes.html" target="_blank">Ver catálogo completo</a>
    </div>
  </div>
</body>
</html>
